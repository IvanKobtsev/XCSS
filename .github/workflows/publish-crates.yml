name: Publish Rust crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or resume (for example v0.12.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Verify release tag matches all crate versions
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'A version tag such as v0.12.0 is required.'
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata failed.' }
          foreach ($package in $metadata.packages) {
            if ("v$($package.version)" -ne $env:RELEASE_TAG) {
              throw "Tag does not match $($package.name) version $($package.version)."
            }
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Validate and publish crates in dependency order
        shell: pwsh
        run: ./scripts/publish-crates.ps1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
