name: Rust packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Inspect publishable package contents
        shell: bash
        run: |
          set -euo pipefail
          for crate in xcss-source xcss-syntax xcss-analysis xcss-typescript xcss-language-service xcss-format xcss-codegen xcss-core xcss-resolver xcss-cli; do
            cargo package --locked --list -p "$crate"
          done
      - name: Verify base crate packaging
        run: cargo publish --dry-run --locked -p xcss-source
