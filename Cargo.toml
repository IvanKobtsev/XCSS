[workspace]
members = ["crates/xcss-core", "crates/xcss-cli", "crates/xcss-node"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanKobtsev/XCSS"

[workspace.dependencies]
raffia = "=0.13.0"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
napi-build = "2"

