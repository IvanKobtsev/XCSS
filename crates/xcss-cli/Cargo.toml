[package]
name = "xcss-cli"
description = "Command-line compiler for XCSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[[bin]]
name = "xcss"
path = "src/main.rs"

[dependencies]
serde.workspace = true
tiny_http = "0.12"
xcss-resolver = { path = "../xcss-resolver", version = "=0.15.0" }
xcss-core = { path = "../xcss-core", version = "=0.15.0" }
xcss-language-service = { path = "../xcss-language-service", version = "=0.15.0" }

serde_json.workspace = true
pathdiff = "=0.2.3"

xcss-syntax = { path = "../xcss-syntax", version = "=0.15.0" }
xcss-source = { path = "../xcss-source", version = "=0.15.0" }
